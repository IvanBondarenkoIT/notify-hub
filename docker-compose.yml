services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://notify:notify@db:5432/notify_hub
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
